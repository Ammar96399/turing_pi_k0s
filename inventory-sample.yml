---
turing_pi_cluster:
  children:
    server:
      hosts:
        akazem-r2:
    agent:
      hosts:
        akazem-r0:
        akazem-r1:

  # Required Vars
  vars:
    ansible_port: 22
    ansible_user: ubuntu
    k3s_version: v1.32.2+k3s1
    api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"

    one_minute: 10
    scrape_interval: 5
    playbook_dir: "{{ lookup('env', 'PWD') }}"
    results_dir: "/home/akazem/Documents/PhD/projects/energy_proportionality/results/turing_pi_emulation/test_3"
    local_user: akazem
    workload: eventdriven
    # airgap_dir: /tmp/k3s-airgap-images
    # server_config_yaml:   # This should be set if you want to use a custom k3s server config

localhost:
  hosts:
    localhost:
      ansible_connection: local
  vars:
    one_minute: 10
    scrape_interval: 5
    playbook_dir: "{{ lookup('env', 'PWD') }}"
    results_dir: "/home/akazem/Documents/PhD/projects/energy_proportionality/results/turing_pi_emulation/test_3"
    local_user: akazem
    workload: eventdriven
