---
turing_pi_cluster:
  children:
    server:
      hosts:
        akazem-r0:
    agent:
      hosts:
        akazem-r1:
        akazem-r3:

  # Required Vars
  vars:
    ansible_port: 22
    ansible_user: akazem
    k3s_version: v1.32.2+k3s1
    api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"
    one_minute: 10
    scrape_interval: 5
    playbook_dir: "{{ lookup('env', 'PWD') }}"
    results_dir: "/home/akazem/Documents/PhD/projects/energy_proportionality/results/turing_pi_emulation/degradation/nepal_scenario/test_4"
    local_user: akazem
    workload: longterm
    helm_version: "v3.17.0"
    helm_binary_path: "/usr/local/bin/helm"
    k3s_kubeconfig: "/home/akazem/k0s-kubeconfig.yml"
    monitoring_namespace: "monitoring"
    experiment_id: "test_4"
    solar_lat: 45
    solar_lon: 8
    solar_start: "2023-01-01"
    solar_end: "2023-01-07"
    stc_irradiance: 1000.0
    system_losses: 0.14
    battery_capacity_wh: 1024.0
    initial_soc_wh: 1024.0
    max_charge_w: 800.0
    charge_efficiency: 0.95
    discharge_efficiency: 0.94

localhost:
  hosts:
    localhost:
      ansible_connection: local
  vars:
    one_minute: 10
    scrape_interval: 5
    playbook_dir: "{{ lookup('env', 'PWD') }}"
    results_dir: "/home/akazem/Documents/PhD/projects/energy_proportionality/results/turing_pi_emulation/degradation/nepal_scenario/test_4"
    kubeconfig: "/home/akazem/Documents/PhD/projects/energy_proportionality/cluster_configuration/k0s-kubeconfig.yml"
    local_user: akazem
    workload: longterm
    experiment_id: "test_4"
    solar_lat: 45
    solar_lon: 8
    solar_start: "2023-01-01"
    solar_end: "2023-01-07"
    stc_irradiance: 1000.0
    system_losses: 0.14
    battery_capacity_wh: 1024.0
    initial_soc_wh: 1024.0
    max_charge_w: 800.0
    charge_efficiency: 0.95
    discharge_efficiency: 0.94
    tz_offset_hours: 1
