---
turing_pi_cluster:
  children:
    server:
      hosts:
        akazem-r0:
    agent:
      hosts:
        akazem-r1:
        akazem-r2:

  # Required Vars
  vars:
    ansible_port: 22
    ansible_user: ubuntu
    k3s_version: v1.32.2+k3s1
    api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"

    one_minute: 16
    scrape_interval: 8
    playbook_dir: "{{ lookup('env', 'PWD') }}"
    results_dir: "/home/akazem/Documents/PhD/projects/energy_proportionality/results/turing_pi_emulation/with_overload/long_term/gold/test_6"
    local_user: akazem
    workload: longterm
    helm_version: "v3.17.0"
    helm_binary_path: "/usr/local/bin/helm"
    k3s_kubeconfig: "/home/ubuntu/k0s-kubeconfig.yml"
    monitoring_namespace: "monitoring"
    # airgap_dir: /tmp/k3s-airgap-images
    # server_config_yaml:   # This should be set if you want to use a custom k3s server config

localhost:
  hosts:
    localhost:
      ansible_connection: local
  vars:
    one_minute: 16
    scrape_interval: 8
    playbook_dir: "{{ lookup('env', 'PWD') }}"
    results_dir: "/home/akazem/Documents/PhD/projects/energy_proportionality/results/turing_pi_emulation/with_overload/long_term/gold/test_6"
    local_user: akazem
    workload: longterm
    strategy: green
