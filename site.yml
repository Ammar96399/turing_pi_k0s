---
- name: Cluster preparation
  hosts: turing_pi_cluster
  gather_facts: true
  become: true
  roles:
    - role: prereq
    - role: airgap
    - role: raspberrypi

- name: Setup k3s server
  hosts: server
  gather_facts: true
  become: true
  roles:
    - role: k3s_server
  vars:
    label: model=cm4

- name: Setup k3s agent
  hosts: agent
  gather_facts: true
  become: true
  roles:
    - role: k3s_agent
  vars:
    label: model=rk1

- name: Setup monitoring
  hosts: server
  gather_facts: true
  become: true
  roles:
    - role: monitoring
