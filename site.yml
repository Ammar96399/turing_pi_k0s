---
- name: Cluster preparation
  hosts: turing_pi_cluster
  gather_facts: true
  become: true
  roles:
    - download
    - role: prereq
    - role: raspberrypi

- name: Setup k3s server
  hosts: server
  gather_facts: true
  become: true
  roles:
    - role: k0s_server
  vars:
    label: role=server,model=rk1

- name: Setup k3s agent
  hosts: agent
  gather_facts: true
  become: true
  roles:
    - role: k0s_agent
  vars:
    label: "{{ 'role=worker,model=rk1' if inventory_hostname == 'akazem-r1' else 'role=worker,model=cm4' }}"

- name: Setup monitoring
  hosts: server
  gather_facts: true
  become: true
  roles:
    - role: monitoring
