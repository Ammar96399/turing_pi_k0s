---
- name: Setup monitoring
  hosts: server
  gather_facts: true
  become: true
  roles:
    - role: monitoring

- name: Prepare event term simulation
  hosts: turing_pi_cluster
  gather_facts: true
  become: true
  roles:
    - role: deploy_applications_prereq

- name: Start system measurements
  hosts: localhost
  gather_facts: true
  roles:
    - role: system_measurements

- name: Run event term simulation
  hosts: server
  gather_facts: true
  become: true
  roles:
    - role: deploy_applications

- name: Inject workload
  hosts: localhost
  gather_facts: true
  roles:
    - role: workloads_injector
  vars:
    observatory: "event_driven_observatory"
