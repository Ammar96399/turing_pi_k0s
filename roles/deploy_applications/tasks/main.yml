---
- name: Delete long-term-simulation namespace if it exists
  ansible.builtin.shell: |
    k0s kubectl delete namespace long-term-simulation --ignore-not-found
  ignore_errors: true

- name: Delete event-driven-simulation namespace if it exists
  ansible.builtin.shell: |
    k0s kubectl delete namespace event-driven-simulation --ignore-not-found
  ignore_errors: true

- name: Delete longterm-simulation namespace if it exists
  ansible.builtin.shell: |
    k0s kubectl delete namespace longterm-simulation --ignore-not-found
  ignore_errors: true

- name: Delete eventdriven-simulation namespace if it exists
  ansible.builtin.shell: |
    k0s kubectl delete namespace eventdriven-simulation --ignore-not-found
  ignore_errors: true

- name: Ensure {{ workload }}-simulation namespace exists
  ansible.builtin.shell: |
    k0s kubectl create namespace {{ workload }}-simulation --dry-run=client -o yaml | k0s kubectl apply -f -
  ignore_errors: true

- name: Create ServiceAccount for node label access
  ansible.builtin.shell: |
    k0s kubectl apply -f - <<EOF
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: node-reader
      namespace: {{ workload }}-simulation
    EOF
  register: sa_result
  failed_when: sa_result.rc != 0

- name: Create ClusterRole for reading node information
  ansible.builtin.shell: |
    k0s kubectl apply -f - <<EOF
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: node-reader
    rules:
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get"]
    EOF
  register: cr_result
  failed_when: cr_result.rc != 0

- name: Create ClusterRoleBinding for node-reader
  ansible.builtin.shell: |
    k0s kubectl apply -f - <<EOF
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: node-reader-binding
    subjects:
    - kind: ServiceAccount
      name: node-reader
      namespace: {{ workload }}-simulation
    roleRef:
      kind: ClusterRole
      name: node-reader
      apiGroup: rbac.authorization.k8s.io
    EOF
  register: crb_result
  failed_when: crb_result.rc != 0

- name: Run Jobs for multiple workload numbers in {{ workload }}-simulation namespace
  ansible.builtin.shell: |
    python3 /home/{{ ansible_user }}/simulation/{{ workload }}_simulation/get_request.py {{ workload_number }} > /tmp/request;
    python3 /home/{{ ansible_user }}/simulation/{{ workload }}_simulation/get_limit.py {{ workload_number }} > /tmp/limit;
    export REQUEST=$(cat /tmp/request);
    export LIMIT=$(cat /tmp/limit);
    k0s kubectl apply -f - <<EOF
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: application-simulator-{{ workload_number }}
      namespace: {{ workload }}-simulation
    spec:
      ttlSecondsAfterFinished: 10
      backoffLimit: 6
      template:
        spec:
          serviceAccountName: node-reader
          containers:
            - name: application-simulator
              image: application-simulator:local
              args:
                - "{{ workload_number }}"
                - "{{ one_minute }}"
              imagePullPolicy: Never
              env:
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              resources:
                requests:
                  cpu: "${REQUEST}"
                limits:
                  cpu: "${LIMIT}"
          restartPolicy: OnFailure
          tolerations:
            - key: "node-role.kubernetes.io/not-ready"
              operator: "Exists"
              effect: "NoExecute"
              tolerationSeconds: 1
    EOF
  loop: "{{ range(1, 57) | list }}"
  loop_control:
    loop_var: workload_number
  register: job_result
  failed_when: job_result.rc != 0
