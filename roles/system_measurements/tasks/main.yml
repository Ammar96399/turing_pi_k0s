---
- name: Clean results_dir
  ansible.builtin.file:
    path: "{{ results_dir }}"
    state: absent

- name: Recreate results_dir
  ansible.builtin.file:
    path: "{{ results_dir }}"
    state: directory
    mode: "0755"

- name: Run collect_power.py in background on the localhost and save its PID
  ansible.builtin.shell: bash -c 'python3 {{ playbook_dir }}/roles/system_measurements/files/collect_power.py --output {{ results_dir }}/power_usage.csv > {{ results_dir }}/collect_power.log 2>&1 & echo $! > {{ results_dir }}/collect_power.pid'
  become: true
  args:
    chdir: "{{ playbook_dir }}"
  register: script_result

- name: Display script start information
  ansible.builtin.debug:
    msg: "Prometheus data collection started. PID saved in {{ results_dir }}/prometheus_pid.txt. Logs in {{ results_dir }}/prometheus_log.txt"
