---
- name: Check if Docker is installed
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_installed

- name: Download Docker installation script
  ansible.builtin.get_url:
    url: https://test.docker.com
    dest: /tmp/get-docker.sh
    mode: "0755"
  when: not docker_installed.stat.exists

- name: Execute Docker installation script
  ansible.builtin.command:
    cmd: sh /tmp/get-docker.sh
  args:
    creates: /usr/bin/docker
  when: not docker_installed.stat.exists
  register: docker_install_result
  changed_when: docker_install_result.rc == 0

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Create the simulation directory
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/simulation
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"

- name: Deletes the {{ workload }} simulation directory
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/simulation/{{ workload }}_simulation
    state: absent

- name: Create the {{ workload }} simulation directory
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/simulation/{{ workload }}_simulation
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"

- name: Copy the application configuration file
  ansible.builtin.copy:
    src: "/home/akazem/Documents/PhD/projects/energy_proportionality/cluster_configuration/turing_pi_emulation/roles/workloads_injector/files/nepal_scenario/configs/workloads_configuration.yml"
    dest: "/home/{{ ansible_user }}/simulation/{{ workload }}_simulation"
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Copy the application script
  ansible.builtin.copy:
    src: application.py
    dest: "/home/{{ ansible_user }}/simulation/{{ workload }}_simulation"
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Copy the requirements file
  ansible.builtin.copy:
    src: requirements.txt
    dest: "/home/{{ ansible_user }}/simulation/{{ workload }}_simulation"
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Copy the Dockerfile
  ansible.builtin.copy:
    src: Dockerfile
    dest: "/home/{{ ansible_user }}/simulation/{{ workload }}_simulation"
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Copy the get_request script
  ansible.builtin.copy:
    src: get_request.py
    dest: "/home/{{ ansible_user }}/simulation/{{ workload }}_simulation"
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Copy the get_limit script
  ansible.builtin.copy:
    src: get_limit.py
    dest: "/home/{{ ansible_user }}/simulation/{{ workload }}_simulation"
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    force: true

- name: Remove docker image
  ansible.builtin.command: sudo docker image rm application-simulator:local
  ignore_errors: true

- name: Build the docker image
  community.docker.docker_image:
    build:
      path: /home/{{ ansible_user }}/simulation/{{ workload }}_simulation
      nocache: true
    name: application-simulator
    source: build
    tag: local

- name: Check if the docker image tar file exists
  ansible.builtin.stat:
    path: /home/{{ ansible_user }}/simulation/application-simulator.tar
  register: docker_image_tar

- name: Delete the docker image tar file
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/simulation/application-simulator.tar
    state: absent
  when: docker_image_tar.stat.exists

- name: Save the docker image to a tar file
  ansible.builtin.shell: |
    docker save application-simulator:local > /home/{{ ansible_user }}/simulation/application-simulator.tar

- name: Remove the docker image from the nodes
  ansible.builtin.command: sudo k0s ctr images rm docker.io/library/application-simulator:local
  ignore_errors: true

- name: Import the docker image to the nodes
  ansible.builtin.command: sudo k0s ctr images import /home/{{ ansible_user }}/simulation/application-simulator.tar

- name: Delete simulation namespace if it exists
  ansible.builtin.shell: |
    k0s kubectl delete namespace simulation --ignore-not-found
  ignore_errors: true

- name: Ensure simulation namespace exists
  ansible.builtin.shell: |
    k0s kubectl create namespace simulation --dry-run=client -o yaml | k0s kubectl apply -f -
  ignore_errors: true

- name: Create ServiceAccount for node label access
  ansible.builtin.shell: |
    k0s kubectl apply -f - <<EOF
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: node-reader
      namespace: simulation
    EOF
  register: sa_result
  failed_when: sa_result.rc != 0

- name: Create ClusterRole for reading node information
  ansible.builtin.shell: |
    k0s kubectl apply -f - <<EOF
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: node-reader
    rules:
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get"]
    EOF
  register: cr_result
  failed_when: cr_result.rc != 0

- name: Create ClusterRoleBinding for node-reader
  ansible.builtin.shell: |
    k0s kubectl apply -f - <<EOF
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: node-reader-binding
    subjects:
    - kind: ServiceAccount
      name: node-reader
      namespace: simulation
    roleRef:
      kind: ClusterRole
      name: node-reader
      apiGroup: rbac.authorization.k8s.io
    EOF
  register: crb_result
  failed_when: crb_result.rc != 0
