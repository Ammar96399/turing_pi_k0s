- name: Manage results directory
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Clean results_dir
      ansible.builtin.file:
        path: "{{ results_dir }}"
        state: absent

    - name: Recreate results_dir
      ansible.builtin.file:
        path: "{{ results_dir }}"
        state: directory
        mode: "0755"

- name: Run time_proxy
  hosts: localhost
  gather_facts: true
  roles:
    - role: time_proxy
  vars:
    reset_time_proxy: false

- name: Run hourly solar energy model
  hosts: localhost
  gather_facts: true
  roles:
    - role: qos_monitoring